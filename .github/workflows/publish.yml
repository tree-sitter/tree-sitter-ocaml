name: Publish packages

on:
  push:
    tags:
      - "*"
      - "!*-abi*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github:
    uses: tree-sitter/workflows/.github/workflows/release.yml@v1
  npm:
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@v1
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
  crates:
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@v1
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
  pypi:
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@v1
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}
